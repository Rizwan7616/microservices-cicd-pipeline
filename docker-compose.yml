version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: provisioning-microservice
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s